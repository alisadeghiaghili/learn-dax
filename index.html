<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>learnDax — interactive DAX sandbox and challenges</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="alternate icon" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="logo" href="./" aria-label="learnDax home">
          <img src="./assets/logo-mark.svg" width="28" height="28" alt="" />
          <span class="logo-word">learn<em>Dax</em></span>
        </a>
        <div id="mode-badge" class="mode-badge">sandbox</div>
        <div class="topbar-actions">
          <button class="btn lang" type="button" title="Language">
            EN <span class="caret">▼</span>
          </button>
          <button id="btn-levels" class="btn" type="button">Levels</button>
          <button id="btn-lesson" class="btn" type="button">Lesson</button>
          <button id="btn-guide" class="btn" type="button">Guide</button>
          <button id="btn-hint" class="btn" type="button">Hint</button>
          <button id="btn-solution" class="btn" type="button">Solution</button>
          <button id="btn-undo" class="btn" type="button">Undo</button>
          <button id="btn-reset" class="btn" type="button">Reset</button>
          <button id="btn-sandbox" class="btn" type="button">Sandbox</button>
          <button id="btn-help" class="btn icon" type="button" title="Help">?</button>
          <a
            class="btn icon"
            href="https://github.com/alisadeghiaghili/learn-dax"
            target="_blank"
            rel="noopener noreferrer"
            title="GitHub"
            aria-label="GitHub repository"
          >
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
          </a>
          <a
            class="btn coffee"
            href="https://linktr.ee/aliaghili"
            target="_blank"
            rel="noopener noreferrer"
          >Buy me a coffee</a>
        </div>
      </header>

      <main class="main">
        <section class="panel">
          <div class="panel-head">Model &amp; filter context</div>
          <div class="panel-body">
            <svg id="model-graph" viewBox="0 0 360 220" role="img" aria-label="Star schema"></svg>
            <div id="filter-chips" class="chips"></div>
            <div class="legend">
              Gold = filter context · Blue = row context · Edges light along dim → fact.
              Type <code>help</code> in the terminal.
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">Evaluation</div>
          <div class="panel-body">
            <div id="expr-box" class="expr-box">// enter a DAX expression below</div>
            <div id="result-meta" class="result-meta"></div>
            <div id="result"></div>
          </div>
        </section>
      </main>

      <section class="terminal">
        <div id="term-out" class="term-out" aria-live="polite"></div>
        <div class="term-input-row">
          <span class="prompt">$</span>
          <input
            id="term-input"
            class="term-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="eval SUM(Sales[Amount])   ·   levels   ·   help"
          />
        </div>
      </section>
    </div>

    <div id="modal-root"></div>
    <script type="module" src="./src/ui/app.js"></script>
  </body>
</html>
